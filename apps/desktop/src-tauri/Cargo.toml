[package]
name = "xblob-desktop"
version = "0.1.0"
description = "xblob Desktop - Classic Xbox Media Inspection & Preservation Shell"
authors = ["xblob contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "xblob_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cmake = "0.1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
